<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온도 반응형 촉각 라벨 구성 및 작동 원리</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e9e9; font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif; color: #111; }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 14px; background: rgba(255,255,255,.95); border-bottom: 1px solid #d6d6d6;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
  header a {
    flex: none; padding: 7px 12px; border-radius: 999px;
    background: #111; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none;
  }
  main { max-width: 860px; margin: 0 auto; padding: 12px 10px 40px; }
  img { display: block; width: 100%; height: auto; margin: 0 0 12px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
</style>
</head>
<body>
  <header>
    <h1>온도 반응형 촉각 라벨<br>구성 및 작동 원리</h1>
    <a href="report.pdf" download>PDF 저장</a>
  </header>
  <main>
    <img src="pages/p-1.jpg" alt="1페이지">
    <img src="pages/p-2.jpg" alt="2페이지" loading="lazy">
    <img src="pages/p-3.jpg" alt="3페이지" loading="lazy">
    <img src="pages/p-4.jpg" alt="4페이지" loading="lazy">
    <img src="pages/p-5.jpg" alt="5페이지" loading="lazy">
    <img src="pages/p-6.jpg" alt="6페이지" loading="lazy">
    <img src="pages/p-7.jpg" alt="7페이지" loading="lazy">
  </main>
</body>
</html>
